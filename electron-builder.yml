appId: org.shillington.timecenter
productName: Time Center
directories:
  output: dist
  buildResources: build
files:
  - out/main/**
  - out/preload/**
  - out/renderer/**
  # The menu-bar icon: electron-vite's `?asset` imports point at resources/ rather than copying into out/.
  - resources/tray*.png
  - package.json
asar: true
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: arm64
  # electron-builder signs ad-hoc; `npm run package` then re-signs with the local self-signed certificate
  # (scripts/signing.mts), so every build has the same identity and macOS keeps its permissions.
  # electron-builder can't use that certificate itself: it only lists `security find-identity -v` (valid,
  # i.e. trusted) identities (app-builder-lib/out/codeSign/macCodeSign.js), and a self-signed one isn't.
  identity: "-"
  hardenedRuntime: false
  extendInfo:
    LSUIElement: true
    NSMicrophoneUsageDescription: Time Center records your side of a meeting so it can be transcribed on this Mac.
    NSAudioCaptureUsageDescription: Time Center records the other side of a meeting so it can be transcribed on this Mac.
    NSAppleEventsUsageDescription: Time Center reads the address of the Chrome tab you're on to show where your time goes.
    NSScreenCaptureUsageDescription: Time Center reads window names and takes a screenshot once a minute, kept only on this Mac.
